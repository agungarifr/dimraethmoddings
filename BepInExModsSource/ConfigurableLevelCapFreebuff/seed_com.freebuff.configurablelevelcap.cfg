[Progression]
## Maximum character level (Default: 99). Set to 25 for vanilla behavior.
## Engine supports up to 99 per attribute and level.
MaxLevelCap = 99

## Maximum per-attribute level (Concentration, Health, Magic Damage, dst).
## Engine supports up to 99.
MaxAttributeCap = 99

## EXP multiplier for all sources (monster kills, quests, items).
## 1.0 = vanilla rate. Increase for faster leveling.
ExpMultiplier = 1.0

[General]
## Patch native GameAssembly.dll byte code (best-effort, byte-verified).
## Set false if game update makes byte patching noisy.
EnableNativeBytePatch = true
