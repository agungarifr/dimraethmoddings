<!doctype html>
<html><head><meta charset="utf-8"><title>Dimraeth Trainer</title>
<style>
body{margin:0;background:#12141a;color:#e9e7e0;font:14px/1.4 "Segoe UI",sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 350px;gap:14px}
.panel{background:#1b1f28;border:1px solid #343c4d;border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#f2c14e;margin:0 0 10px}
table{width:100%;border-collapse:collapse}
td,th{padding:4px 5px;border-bottom:1px solid #262c38;text-align:left}
label{display:inline-block;margin:0 10px 6px 0;color:#8b93a7}
select,input,button{background:#232833;color:#e9e7e0;border:1px solid #3b4457;border-radius:5px;padding:3px 6px;font:inherit}
button{cursor:pointer}button:disabled{opacity:.35;cursor:default}
button:not(:disabled):hover{border-color:#f2c14e}
#prev b{color:#f2c14e}
</style></head><body><div class="wrap"><h1>Dimraeth Trainer</h1>
<div class="grid"><div><div class="panel" id="econ"></div><div class="panel" id="attrs"></div></div>
<div><div class="panel" id="prev"></div><div class="panel" id="info"></div></div></div>
</div><script>const ATTR=["Memory","Charisma","Adventure","Physique","Intelligence","Agility","Strength","Energy"];
const ABBR=["MEM","CHA","ADV","PHY","INT","AGI","STR","ENE"];
const RACE={Human:{b:[3,3,3,3,3,3,3,3],c:[200,200,200,200,200,200,200,200]},
Elf:{b:[3,3,3,1,3,5,3,3],c:[200,240,200,280,160,120,240,160]},
Minotaur:{b:[2,2,3,4,1,3,5,4],c:[240,240,200,160,200,280,120,160]}};
const CLS={Magician:{b:[4,4,3,2,5,2,1,3],c:[160,160,200,240,120,240,280,200]},
Brawler:{b:[2,2,3,4,1,3,5,4],c:[240,240,200,160,280,200,120,160]},
Shadow:{b:[3,3,3,1,3,5,3,3],c:[160,240,200,280,200,120,240,160]}};
const CAP=99,LCAP=25;
function rnd(x){const f=Math.floor(x);return Math.abs(x-f-0.5)<1e-9?(f%2?f+1:f):Math.round(x);}
function xpReq(L){return rnd(100*Math.pow(L,1.5)+150);}
let S=null;
function initState(race,cls,level,xp,accum,skill){
 const st=RACE[race].b.map((v,i)=>v+CLS[cls].b[i]);
 const bc=RACE[race].c.map((v,i)=>{const r=v<=0?200:v,c=(CLS[cls].c[i]<=0?200:CLS[cls].c[i]);return Math.round((r+c)/2);});
 return {race,cls,start:st,base:bc,level,xp,accum,skill,attrs:st.slice(),pending:[]};
}
function cost(i,attrs,level){const p=attrs[i]-S.start[i];return Math.ceil(S.base[i]*Math.pow(1+p/3,1.1)+100*level);}
function sim(){let a=S.attrs.slice(),xp=S.xp,ac=S.accum,lv=S.level;
 for(const i of S.pending){if(lv>=LCAP)break;if(a[i]>=CAP)continue;const c=cost(i,a,lv);if(xp<c)continue;
  xp-=c;ac+=c;a[i]++;while(lv<LCAP&&ac>=xpReq(lv)){ac-=xpReq(lv);lv++;}}
 return {attrs:a,xp,accum:ac,level:lv};}
function pdmg(a){return a[6]+0.5*(a[5]+a[2]);}
function mdmg(a){return a[4]+0.5*(a[1]+a[2]);}
const el=id=>document.getElementById(id);
function render(){const m=sim();renderEcon(m);renderAttrs(m);renderPrev(m);renderInfo(m);}
function renderEcon(m){
 const req=xpReq(m.level),cap=m.level>=LCAP;
 const pct=cap?100:Math.min(100,m.accum/req*100);
 el("econ").innerHTML=`<h2>Level &amp; Experience</h2>
 <div style="display:flex;justify-content:space-between"><b>Level ${m.level}${cap?" (cap)":""}</b><span>Skill points: ${S.skill}</span></div>
 <div style="background:#0e1015;border:1px solid #343c4d;border-radius:6px;height:16px;margin:8px 0;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#6fce8f,#f2c14e)"></div></div>
 <div style="color:#8b93a7">XP bar (accum): ${m.accum} / ${cap?"max":req}</div>
 <div>XP pool (spendable): <b>${m.xp}</b></div>`;
}
function renderAttrs(m){
 let h=`<h2>Attributes</h2><table><tr><th>Stat</th><th>Now</th><th>Pending</th><th>Next cost (XP)</th><th></th></tr>`;
 for(let i=0;i<8;i++){
  const pend=S.pending.filter(x=>x===i).length;
  const c=cost(i,m.attrs,m.level);
  const can=m.level<LCAP&&m.attrs[i]<CAP&&m.xp>=c;
  h+=`<tr><td title="${ATTR[i]}">${ABBR[i]}</td><td><b>${m.attrs[i]}</b></td><td style="color:#6fce8f">${pend?"+"+pend:""}</td><td>${m.attrs[i]>=CAP?"MAX":c}</td>`;
  h+=`<td style="text-align:right;white-space:nowrap"><button data-r="${i}" ${pend?"":"disabled"}>-</button> <button data-a="${i}" ${can?"":"disabled"}>+</button> <button data-m="${i}" ${can?"":"disabled"}>max</button></td></tr>`;
 }
 h+=`</table>`;
 el("attrs").innerHTML=h;
 el("attrs").querySelectorAll("button[data-a]").forEach(b=>b.onclick=()=>{addPt(+b.dataset.a);});
 el("attrs").querySelectorAll("button[data-r]").forEach(b=>b.onclick=()=>{refundPt(+b.dataset.r);});
 el("attrs").querySelectorAll("button[data-m]").forEach(b=>b.onclick=()=>{maxPt(+b.dataset.m);});
}
function addPt(i){const m=sim();if(m.level>=LCAP||m.attrs[i]>=CAP)return;if(m.xp<cost(i,m.attrs,m.level))return;S.pending.push(i);render();}
function refundPt(i){const k=S.pending.lastIndexOf(i);if(k<0)return;S.pending.splice(k,1);render();}
function maxPt(i){let g=0;while(g++<200){const m=sim();if(m.level>=LCAP||m.attrs[i]>=CAP||m.xp<cost(i,m.attrs,m.level))break;S.pending.push(i);}render();}
function confirm(){const m=sim();S.attrs=m.attrs;S.xp=m.xp;S.accum=m.accum;S.level=m.level;S.pending=[];render();}
function resetPending(){S.pending=[];render();}
function respec(){S.attrs=S.start.slice();S.level=1;S.accum=0;S.pending=[];render();}
function renderPrev(m){const p=pdmg(m.attrs),g=mdmg(m.attrs);
 el("prev").innerHTML=`<h2>Primary Stats (preview)</h2><table><tr><th>Stat</th><th>Value</th></tr>
 <tr><td>Physical Damage</td><td><b>${p.toFixed(1)}</b></td></tr>
 <tr><td>Magic Damage</td><td><b>${g.toFixed(1)}</b></td></tr></table>
 <div style="color:#8b93a7;font-size:12px;margin-top:8px">Physical = STR + 0.5*(AGI+ADV)<br>Magic = INT + 0.5*(CHA+ADV)</div>`;}
function renderInfo(m){
 el("info").innerHTML=`<h2>Port notes</h2>
 <div style="color:#8b93a7;font-size:12px">Source: PlayerUpgradeUI / NPCTrainView / Formulas.<br>
 Cost = ceil(base*(1+(value-start)/3)^1.1 + 100*level).<br>
 Level-up when accumXP crosses roundHalfEven(100*L^1.5+150). Caps: attr ${CAP}, level ${LCAP}.<br>
 Health / Concentration / Stamina / AttackSpeed / Encumbrance previews omitted (need rune+effect+base-stat data).</div>
 <div style="margin-top:10px"><button id="bf">Confirm</button> <button id="br">Discard</button> <button id="bp">Respec</button></div>
 <div style="color:#8b93a7;font-size:12px;margin-top:6px">Pending sequence (order matters): ${S.pending.map(i=>ABBR[i]).join(" ")||"(none)"}</div>`;
 el("bf").onclick=confirm; el("br").onclick=resetPending; el("bp").onclick=respec;
}
function applyCtl(){const r=el("sr").value,c=el("sc").value;
 S=initState(r,c,Math.max(1,Math.min(25,+el("lv").value||1)),Math.max(0,+el("xp").value||0),Math.max(0,+el("ac").value||0),Math.max(0,+el("sk").value||0));
 render();}
function boot(){
 el("econ").insertAdjacentHTML("beforebegin",
 `<div class="panel" id="ctl"><h2>Character</h2>
 <label>Race <select id="sr">${Object.keys(RACE).map(k=>`<option>${k}</option>`).join("")}</select></label>
 <label>Class <select id="sc">${Object.keys(CLS).map(k=>`<option>${k}</option>`).join("")}</select></label>
 <label>Level <input id="lv" type="number" min="1" max="25" value="1" style="width:60px"></label>
 <label>XP pool <input id="xp" type="number" min="0" value="122409" style="width:96px"></label>
 <label>XP bar accum <input id="ac" type="number" min="0" value="0" style="width:84px"></label>
 <label>Skill pts <input id="sk" type="number" min="0" value="0" style="width:60px"></label>
 </div>`);
 el("sr").value="Elf"; el("sc").value="Magician";
 el("sr").onchange=applyCtl; el("sc").onchange=applyCtl;
 ["lv","xp","ac","sk"].forEach(id=>el(id).onchange=applyCtl);
 applyCtl();
}
boot();
/*P9*/</script></body></html>
