<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dimraeth anti-cheat — architecture graph</title>
<!--
  Self-contained visualization for modding/docs/anticheat/ (no external dependencies).
  Click any node to open its documentation file. Two views: defense pipeline (timeline)
  and relationship map (who talks to whom).
-->
<style>
  :root {
    --perimeter:#4a90d9; --detector:#8e6fc7; --data:#8a93a3;
    --outcome:#d9534f; --telemetry:#e08a2e; --qa:#5aa469;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, sans-serif; background:#12151c; color:#dfe4ec; }
  header { padding:14px 22px 8px; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .sub { font-size:12.5px; color:#98a2b3; }
  .tabs { padding:4px 22px 10px; display:flex; gap:8px; }
  .tabs button {
    background:#1e2430; color:#c6cede; border:1px solid #303a4c; border-radius:6px;
    padding:7px 14px; font-size:13px; cursor:pointer;
  }
  .tabs button.active { background:#2b3650; color:#fff; border-color:#4a5c80; }
  #stage { padding:0 14px 8px; overflow:auto; }
  svg { display:block; margin:0 auto; background:#171b24; border:1px solid #262e3d; border-radius:10px; width:100%; max-width:1240px; height:auto; }
  .node rect { stroke-width:1.4; rx:8; cursor:pointer; transition:filter .12s; }
  .node:hover rect { filter:brightness(1.35); }
  .node text { pointer-events:none; font-size:12.5px; fill:#f2f5fa; }
  .node .meta { font-size:10.5px; fill:#aab4c5; }
  .edge { stroke:#5b677d; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
  .edge.hot { stroke:#d9534f; }
  .edge.dim { stroke:#3d4657; stroke-dasharray:4 4; }
  .elabel { font-size:10.5px; fill:#93a0b5; }
  .lane { fill:#1d222d; stroke:#2a3242; rx:10; }
  .laneTitle { font-size:11.5px; fill:#7d8aa0; letter-spacing:.06em; }
  .legend { padding:6px 22px 18px; display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:#98a2b3; }
  .legend span::before { content:""; display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--c); }
</style>
</head>
<body>
<header>
  <h1>Dimraeth — anti-cheat architecture</h1>
  <span class="sub">click a node to open its doc &middot; hover for details &middot; source: modding/docs/anticheat/</span>
</header>
<div class="tabs">
  <button id="tab-pipe" class="active" onclick="show('pipe')">1 &middot; Defense pipeline (connect &rarr; kick)</button>
  <button id="tab-rel" onclick="show('rel')">2 &middot; Relationship map (who talks to whom)</button>
</div>
<div id="stage">
  <svg id="svg-pipe" width="1240" height="880" viewBox="0 0 1240 880"></svg>
  <svg id="svg-rel" width="1240" height="880" viewBox="0 0 1240 880" style="display:none"></svg>
</div>
<div class="legend">
  <span style="--c:var(--perimeter)">Perimeter (network authority)</span>
  <span style="--c:var(--detector)">Detector / validator</span>
  <span style="--c:var(--data)">Data &amp; storage</span>
  <span style="--c:var(--outcome)">Enforcement outcome</span>
  <span style="--c:var(--telemetry)">Telemetry</span>
  <span style="--c:var(--qa)">QA tooling</span>
</div>

<script>
const C = { perimeter:'#4a90d9', detector:'#8e6fc7', data:'#8a93a3', outcome:'#d9534f', telemetry:'#e08a2e', qa:'#5aa469' };

// Generic renderer: nodes {id,x,y,w,h,label,meta,color,doc,tip}, edges {a,b,label,style,from:'r|l|t|b',to:'r|l|t|b'}
function anchor(n, side) {
  if (side === 'l') return [n.x,        n.y + n.h/2];
  if (side === 't') return [n.x + n.w/2, n.y];
  if (side === 'b') return [n.x + n.w/2, n.y + n.h];
  return               [n.x + n.w,   n.y + n.h/2];        // 'r'
}
function draw(svg, nodes, edges, lanes) {
  const ns = 'http://www.w3.org/2000/svg';
  svg.innerHTML = `<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b677d"/></marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9534f"/></marker>
  </defs>`;
  const add = (tag, attrs, parent) => { const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };

  (lanes || []).forEach(l => {
    add('rect', { class:'lane', x:l.x, y:l.y, width:l.w, height:l.h });
    add('text', { class:'laneTitle', x:l.x + 12, y:l.y + 20 }).textContent = l.title;
  });

  edges.forEach(e => {
    const a = nodes.find(n => n.id === e.a), b = nodes.find(n => n.id === e.b);
    const [x1, y1] = anchor(a, e.from || 'r'), [x2, y2] = anchor(b, e.to || 'l');
    const mx = (x1 + x2) / 2;
    const d = (e.from === 'b' || e.from === 't')
      ? `M ${x1} ${y1} C ${x1} ${(y1+y2)/2}, ${x2} ${(y1+y2)/2}, ${x2} ${y2}`
      : `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
    add('path', { class: 'edge' + (e.style ? ' ' + e.style : ''), d,
                  'marker-end': e.style === 'hot' ? 'url(#arrow-hot)' : 'url(#arrow)' });
    if (e.label) add('text', { class:'elabel', x:(x1+x2)/2, y:(y1+y2)/2 - 5, 'text-anchor':'middle' }).textContent = e.label;
  });

  nodes.forEach(n => {
    const g = add('g', { class:'node' });
    // [2026-09-29 14:10] Fixed: rect/text were appended to the SVG root instead of the node's <g>
    // (add() defaults to svg when parent is omitted), so .node:hover styling and the click-to-open-doc
    // handler never fired. Old calls kept in comments per repo rule:
    // add('rect', { x:n.x, y:n.y, width:n.w, height:n.h, fill:'#222a3a', stroke:C[n.color] });
    add('rect', { x:n.x, y:n.y, width:n.w, height:n.h, fill:'#222a3a', stroke:C[n.color] }, g);
    // const t = add('text', { x:n.x + n.w/2, y:n.y + (n.meta ? n.h/2 - 3 : n.h/2 + 4), 'text-anchor':'middle' });
    const t = add('text', { x:n.x + n.w/2, y:n.y + (n.meta ? n.h/2 - 3 : n.h/2 + 4), 'text-anchor':'middle' }, g);
    n.label.split('\n').forEach((line, i) => {
      const ts = document.createElementNS(ns, 'tspan');
      ts.setAttribute('x', n.x + n.w/2); if (i) ts.setAttribute('dy', 14);
      ts.textContent = line; t.appendChild(ts);
    });
    // add('text', { class:'meta', x:n.x + n.w/2, y:n.y + n.h - 8, 'text-anchor':'middle' }).textContent = n.meta;
    if (n.meta) add('text', { class:'meta', x:n.x + n.w/2, y:n.y + n.h - 8, 'text-anchor':'middle' }, g).textContent = n.meta;
    const tip = document.createElementNS(ns, 'title'); tip.textContent = n.tip || n.label; g.appendChild(tip);
    g.addEventListener('click', () => { if (n.doc) window.open(n.doc, '_blank'); });
  });
}

function show(v) {
  document.getElementById('svg-pipe').style.display = v === 'pipe' ? 'block' : 'none';
  document.getElementById('svg-rel').style.display  = v === 'rel'  ? 'block' : 'none';

</script>
